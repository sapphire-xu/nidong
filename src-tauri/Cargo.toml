[package]
name = "nidong"
version = "2.0.1"
description = "东北大学桌面小看板"
authors = ["sapphire_fic"]
edition = "2021"

[lib]
name = "nidong_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "gzip", "native-tls", "http2"] }
reqwest_cookie_store = "0.8"
cookie_store = { version = "0.21", features = ["serde", "serde_json"] }
cookie = "0.18"
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
base64 = "0.22"
scraper = "0.22"
regex = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
encoding_rs = "0.8"
url = "2"
urlencoding = "2"
once_cell = "1"
aes = "0.8"
hex = "0.4"
tauri-plugin-updater = "2.13.1"
tauri-plugin-process = "2.4.0"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
